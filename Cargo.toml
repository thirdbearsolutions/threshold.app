[workspace]
resolver = "2"
members = ["crates/threshold-core", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/thirdbearsolutions/threshold.app"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
