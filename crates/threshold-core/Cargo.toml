[package]
name = "threshold-core"
description = "Unified-diff parsing, pinning, the review session log and the decision log: the engine behind Threshold."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "threshold_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
